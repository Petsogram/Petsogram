<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miko Widget — Demo</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FAF6EF;
    color: #21302A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .demo-card { max-width: 480px; }
  .demo-card h1 { font-size: 22px; margin-bottom: 8px; }
  .demo-card p { color: rgba(33,48,42,0.65); line-height: 1.6; font-size: 14px; }
  code {
    background: #fff;
    border: 1px solid rgba(33,48,42,0.12);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
</style>
<link rel="stylesheet" href="miko-widget.css">
</head>
<body>

<div class="demo-card">
  <h1>This page has Miko installed 🐾</h1>
  <p>Click the round button in the bottom-right corner to try the chat widget.
  Try the quick-action buttons, or type something like "my dog is hurt" or
  "how do I adopt".</p>
  <p>See <code>README.md</code> for how to embed this on your real site and
  connect it to your own backend.</p>
</div>

<script src="miko-widget.js"></script>
<script>
  Miko.init({
    links: {
      vet: '/find-a-vet',
      adopt: '/adopt',
      groom: '/grooming',
      complaint: '/report',
      market: '/marketplace',
      meetup: '/meetups',
      donate: '/donate'
    }
    // backendUrl: 'https://your-api.example.com/miko/chat'
  });
</script>

</body>
</html>
